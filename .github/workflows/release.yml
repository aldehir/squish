name: release

# Pushing a v* tag builds, tests, and publishes a prerelease. A push to
# main or a manual run builds and tests only, and keeps the zip as a
# workflow artifact. A run reads the caches of its own ref and of main,
# never another tag's, so it's the runs on main that fill the tags'.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.0
  ZIG_SHA256: b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428

defaults:
  run:
    shell: pwsh

jobs:
  # The window's tests, a Debug build of their own, beside the release
  # build rather than ahead of it.
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        id: zig
        with:
          path: tools/zig-x86_64-windows-${{ env.ZIG_VERSION }}
          key: zig-${{ env.ZIG_VERSION }}

      # Into tools\, where scripts/setup-msvc.ps1 expects it.
      - name: Install Zig
        if: steps.zig.outputs.cache-hit != 'true'
        run: |
          $name = "zig-x86_64-windows-$env:ZIG_VERSION"
          $zip = "$env:RUNNER_TEMP\$name.zip"
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:ZIG_SHA256) { throw "zig sha256 mismatch: $hash" }
          Expand-Archive $zip -DestinationPath tools

      - name: Find the ghostty commit
        id: ghostty
        run: |
          "sha=$(git rev-parse HEAD:ghostty)" >> $env:GITHUB_OUTPUT

      # The packages Zig fetches, and no more: its build caches miss on
      # a runner with another CPU than the one that saved them, the tools
      # a build runs being compiled for the host's. Keyed by the ghostty
      # commit, not the manifests, which hold the version.
      - uses: actions/cache@v4
        with:
          path: |
            zig-pkg
            clients/gui/zig-pkg
            ghostty/zig-pkg
          key: pkg-test-${{ steps.ghostty.outputs.sha }}

      - name: Test
        run: |
          . .\scripts\setup-msvc.ps1
          zig build test

  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        id: zig
        with:
          path: tools/zig-x86_64-windows-${{ env.ZIG_VERSION }}
          key: zig-${{ env.ZIG_VERSION }}

      - name: Install Zig
        if: steps.zig.outputs.cache-hit != 'true'
        run: |
          $name = "zig-x86_64-windows-$env:ZIG_VERSION"
          $zip = "$env:RUNNER_TEMP\$name.zip"
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:ZIG_SHA256) { throw "zig sha256 mismatch: $hash" }
          Expand-Archive $zip -DestinationPath tools

      # For the daemon. Caches the module and build caches by go.sum.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Find the ghostty commit
        id: ghostty
        run: |
          "sha=$(git rev-parse HEAD:ghostty)" >> $env:GITHUB_OUTPUT

      # As the test job's, with the packages build.zig fetches into
      # tools\.
      - uses: actions/cache@v4
        with:
          path: |
            zig-pkg
            clients/gui/zig-pkg
            ghostty/zig-pkg
            tools/conpty-*
            tools/webview2-*
          key: pkg-build-${{ steps.ghostty.outputs.sha }}-${{ hashFiles('build.zig') }}

      # libghostty-vt for the daemon, most of a build's time and the same
      # until ghostty or the Zig compiled into it (internal/vt) changes.
      - uses: actions/cache@v4
        id: vt
        with:
          path: |
            internal/vt/lib
            internal/vt/zz_libstamp.go
          key: vt-${{ env.ZIG_VERSION }}-${{ steps.ghostty.outputs.sha }}-${{ hashFiles('internal/vt/*.zig', 'scripts/build-vt-lib.ps1', 'build/libstamp.zig') }}

      - name: Build libghostty-vt
        if: steps.vt.outputs.cache-hit != 'true'
        run: |
          . .\scripts\setup-msvc.ps1
          .\scripts\build-vt-lib.ps1

      - name: Check tag matches build.zig.zon
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $zon = Select-String -Path build.zig.zon -Pattern '\.version = "([^"]+)"'
          $version = $zon.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match build.zig.zon version $version"
          }

      - name: Build
        run: |
          . .\scripts\setup-msvc.ps1
          zig build -Doptimize=ReleaseFast -Dremote=true -Dprebuilt-vt=true --summary all

      # A failing native command does not stop pwsh, so check vet's exit
      # code by hand.
      - name: Test the daemon
        run: |
          . .\scripts\setup-msvc.ps1
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test ./...

      - name: Package
        id: package
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $name = "squish-$version-windows-x86_64"
          $stage = "$env:RUNNER_TEMP\$name"
          Copy-Item zig-out\bin $stage -Recurse
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md $stage
          New-Item -ItemType Directory dist | Out-Null
          Move-Item "$stage\*.pdb" "dist\$name.pdb"
          Compress-Archive $stage "dist\$name.zip"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*

  # Only once both jobs pass.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist -File) --prerelease --generate-notes --title "squish $env:GITHUB_REF_NAME"
